name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sol-cv32-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOL_CV32_MAX_SAMPLES: "32"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q

      - name: Validate WhestBench estimator contract
        run: whest validate --estimator estimator.py

      - name: Reduced-sample competition-shape smoke test
        run: |
          python scripts/smoke_test.py \
            --width 256 \
            --depth 32 \
            --budget 50000000000 \
            --max-fraction 0.1 \
            --max-seconds 60

      - name: Full default competition-budget smoke test
        env:
          SOL_CV32_MAX_SAMPLES: ""
        run: |
          python scripts/smoke_test.py \
            --width 256 \
            --depth 32 \
            --budget 272000000000 \
            --max-fraction 0.1 \
            --max-seconds 60

      - name: Build submission archive
        run: |
          mkdir -p dist
          whest package \
            --estimator estimator.py \
            --output dist/SOL-CV32-v0.1.tar.gz

      - name: Upload submission archive
        uses: actions/upload-artifact@v4
        with:
          name: SOL-CV32-v0.1-submission
          path: dist/SOL-CV32-v0.1.tar.gz
          if-no-files-found: error
          retention-days: 14
