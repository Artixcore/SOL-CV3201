[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sol-cv32"
version = "0.1.0"
description = "Hybrid white-box and control-variate estimator for ARC WhestBench"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Artixcore" },
]
dependencies = [
    "flopscope>=0.10.0,<0.11.0",
    "whestbench>=0.14.0,<0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<10.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[tool.setuptools]
py-modules = ["estimator"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
